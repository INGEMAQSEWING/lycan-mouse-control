# Compila Lycan Mouse Control para Windows 64 bits: pruebas, PyInstaller, instalador y ZIP portable.
# Solo corre con una etiqueta v* o a mano (workflow_dispatch). No publica nada: deja los archivos
# como "artifacts" del run por 14 días.
name: Lycan Mouse Control - Windows 64 bits

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 3.10 (la misma version del portatil)
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias (versiones fijas)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install mediapipe==0.10.14 numpy==2.2.6 Pillow pytest
          # mediapipe trae opencv-contrib-python 5.x (cv2.pyd de 108 MB + ffmpeg 30 MB).
          # Se cambia por la version sin ventanas (la interfaz es tkinter): ~70 MB menos.
          pip uninstall -y opencv-contrib-python opencv-python
          pip install opencv-python-headless==4.10.0.84
          # PyInstaller con el arrancador compilado aqui (menos falsos positivos de
          # antivirus que el arrancador precompilado que comparten miles de programas).
          pip download --no-binary pyinstaller --no-deps "pyinstaller==6.22.3" -d "$RUNNER_TEMP/pyi"
          PYI_SRC="$(python -c "import glob, os, tarfile; d = os.path.join(os.environ['RUNNER_TEMP'], 'pyi'); t = tarfile.open(glob.glob(os.path.join(d, 'pyinstaller-*.tar.gz'))[0]); t.extractall(d, **({'filter': 'data'} if hasattr(tarfile, 'data_filter') else {})); print(os.path.join(d, t.getnames()[0].split('/')[0]))")"
          PYI_SRC="$(cygpath -u "$PYI_SRC")"
          rm -f "$PYI_SRC"/PyInstaller/bootloader/Windows-64bit-intel/*.exe
          (cd "$PYI_SRC/bootloader" && python ./waf all --target-arch=64bit)
          test -f "$PYI_SRC/PyInstaller/bootloader/Windows-64bit-intel/runw.exe"
          pip install "$PYI_SRC"

      - name: Pruebas (gestos, suavizado, maquina de estados; sin camara)
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q pruebas

      - name: Compilar con PyInstaller
        shell: bash
        run: |
          pyinstaller empaquetado/lycan-mouse-control.spec --noconfirm
          du -sh dist/LycanMouseControl/

      - name: Revisar el paquete
        shell: bash
        run: |
          D=dist/LycanMouseControl/_internal
          test -f dist/LycanMouseControl/LycanMouseControl.exe
          test -f $D/mediapipe/modules/hand_landmark/hand_landmark_tracking_cpu.binarypb
          test -f $D/mediapipe/modules/hand_landmark/hand_landmark_lite.tflite
          test -f $D/mediapipe/modules/palm_detection/palm_detection_lite.tflite
          test ! -d $D/jax
          test ! -d $D/matplotlib

      - name: Prueba de humo del .exe (--check)
        shell: pwsh
        run: |
          # --check: carga mediapipe Hands sobre una imagen negra y sale con 0
          # (no abre la camara ni mueve el raton; el runner no tiene camara).
          # El .exe es "sin consola", por eso se espera con Start-Process -Wait.
          $p = Start-Process "dist\LycanMouseControl\LycanMouseControl.exe" -ArgumentList "--check" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "El .exe fallo (codigo $($p.ExitCode))"; exit 1 }
          "paquete OK"

      - name: Version
        id: ver
        shell: bash
        run: |
          VERSION=$(python -c "import re; print(re.search(r'VERSION\s*=\s*[\"\x27]([^\"\x27]+)', open('lycan_mouse_control/version.py', encoding='utf-8').read()).group(1))")
          # VersionInfoVersion de Inno Setup solo acepta numeros: se pasa aparte la parte N.N.N
          NUM=$(echo "$VERSION" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ -z "$NUM" ]; then echo "La version '$VERSION' no empieza con N.N.N"; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "num=$NUM" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION ($NUM)"

      - name: Inno Setup (instalarlo si la imagen no lo trae)
        shell: pwsh
        run: |
          # windows-latest = windows-2025; Inno Setup no esta garantizado en esa imagen
          # (issue actions/runner-images #11644). Si falta, se instala con Chocolatey.
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-Not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Instalador
        shell: pwsh
        run: |
          # ANTES del ZIP: el LEEME de la version portable no debe quedar dentro del instalador.
          & $env:ISCC "/DMyAppVersion=${{ steps.ver.outputs.version }}" "/DMyAppVersionNum=${{ steps.ver.outputs.num }}" "empaquetado\lycan-mouse-control.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: ZIP portable
        shell: pwsh
        run: |
          # Copia aparte con su LEEME (la carpeta de dist queda igual a la del instalador).
          New-Item -ItemType Directory -Force dist/portable | Out-Null
          Copy-Item -Recurse -Force dist/LycanMouseControl dist/portable/
          @"
          Lycan Mouse Control - version portable (sin instalar)

          1. Descomprima esta carpeta donde quiera (ej. C:\LycanMouseControl\)
          2. Doble clic en LycanMouseControl.exe
          3. Si Windows dice "Windows protegio su PC": "Mas informacion" y
             "Ejecutar de todas formas".
          4. Arranca en PAUSA. Para pausar en cualquier momento: Ctrl+Alt+M.
          "@ | Out-File dist/portable/LycanMouseControl/LEEME.txt -Encoding utf8
          Compress-Archive -Path dist/portable/LycanMouseControl -DestinationPath "dist/Lycan-Mouse-Control-${{ steps.ver.outputs.version }}-portable.zip"
          Get-ChildItem dist | Format-Table Name, Length

      - name: Subir instalador
        uses: actions/upload-artifact@v4
        with:
          name: lycan-mouse-control-windows
          path: |
            dist/Lycan-Mouse-Control-*.exe
            dist/Lycan-Mouse-Control-*-portable.zip
          retention-days: 14
